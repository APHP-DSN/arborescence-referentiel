<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Checklist d'intégration — Référentiel numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink: #16233D;
    --ink-soft: #5C6B85;
    --line: #DCE6F5;
    --paper: #FFFFFF;
    --bg: #EAF1FC;
    --cream: #E4EEFB;

    --vermillion: #2563EB;
    --vermillion-soft: #DEE9FD;

    --green: #16A34A;
    --green-soft: #E1F6E8;
    --red: #DC2626;
    --red-soft: #FBE3E1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E1EBFA; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 1.5rem 0.75rem;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 42%, rgba(255,255,255,0.97) 72%),
      radial-gradient(rgba(13,127,191,0.3) 1px, transparent 1.4px);
    background-size: 100% 100%, 20px 20px;
    background-position: 0 0, 0 0;
    border-radius: 28px;
    padding: 3rem 3.25rem;
    box-shadow: 10px 10px 0 rgba(22,35,61,0.06);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.22;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  h1 span { color: var(--vermillion); }

  p.lead {
    margin: 0 0 26px 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    max-width: 620px;
    line-height: 1.6;
  }

  .status-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px 0; }

  /* ===== STEP: IDENTIFICATION ===== */
  .id-form {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 220px; }
  .field label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field input, .field select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--vermillion); outline-offset: 1px; }

  .btn-primary {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--paper);
    background: var(--vermillion);
    border: none;
    border-radius: 8px;
    padding: 11px 22px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .btn-primary:disabled { background: #A9BEE0; cursor: not-allowed; }
  .btn-primary:not(:disabled):hover { opacity: 0.9; }

  .btn-secondary {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--vermillion);
    background: var(--vermillion-soft);
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
  }
  .btn-secondary:hover { opacity: 0.85; }

  /* ===== STEP: CHECKLIST ===== */
  .progress-bar-outer {
    height: 8px;
    border-radius: 6px;
    background: var(--bg);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .progress-bar-inner {
    height: 100%;
    background: var(--vermillion);
    border-radius: 6px;
    width: 0%;
    transition: width 0.2s ease;
  }
  .progress-label { font-size: 12.5px; color: var(--ink-soft); margin: -14px 0 22px 0; }

  .theme-group { margin-bottom: 30px; }
  .theme-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .chap-block { margin: 0 0 20px 18px; padding-left: 16px; border-left: 2px solid var(--line); }
  .chap-title {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin: 0 0 10px 0;
  }

  .comp-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    margin-bottom: 8px;
  }
  .comp-row.answered-oui { border-color: var(--green); background: var(--green-soft); }
  .comp-row.answered-non { border-color: var(--red); background: var(--red-soft); }

  .comp-label { font-size: 13.5px; color: var(--ink); line-height: 1.4; }

  .toggle-group { display: flex; gap: 6px; flex-shrink: 0; }
  .toggle-btn {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 20px;
    padding: 6px 16px;
    cursor: pointer;
  }
  .toggle-btn.oui.active { background: var(--green); border-color: var(--green); color: #fff; }
  .toggle-btn.non.active { background: var(--red); border-color: var(--red); color: #fff; }
  .toggle-btn:hover { opacity: 0.85; }

  .submit-bar {
    position: sticky;
    bottom: 0;
    background: var(--paper);
    padding: 18px 0 4px 0;
    border-top: 1px solid var(--line);
    margin-top: 10px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 14px;
  }
  .submit-bar .remaining { font-size: 12.5px; color: var(--ink-soft); margin-right: auto; }

  /* ===== STEP: RESULTATS ===== */
  .score-global {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 26px;
  }
  .score-global .big { font-family: 'Fraunces', serif; font-weight: 700; font-size: 40px; color: var(--vermillion); }
  .score-global .of { font-size: 15px; color: var(--ink-soft); }

  .chap-score-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    background: var(--paper);
  }
  .chap-score-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    cursor: pointer;
  }
  .chap-score-name {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15.5px;
    color: var(--ink);
  }
  .chap-score-theme { font-size: 11px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; }
  .chap-score-fraction { font-size: 13px; font-weight: 600; color: var(--ink-soft); white-space: nowrap; }
  .chap-score-bar-outer { height: 6px; border-radius: 4px; background: var(--bg); margin-top: 10px; overflow: hidden; }
  .chap-score-bar-inner { height: 100%; border-radius: 4px; }

  .chap-missing {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: none;
  }
  .chap-missing.open { display: block; }
  .chap-missing-title { font-size: 11.5px; font-weight: 600; color: var(--red); text-transform: uppercase; letter-spacing: 0.3px; margin: 0 0 8px 0; }
  .missing-pill {
    font-size: 12.5px;
    color: var(--ink);
    background: var(--red-soft);
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 6px;
    line-height: 1.4;
  }
  .missing-pill-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--vermillion);
    text-decoration: none;
  }
  .missing-pill-link:hover { text-decoration: underline; }
  .missing-pill-link-soon { color: var(--ink-soft); font-weight: 500; }
  .chap-caret { font-size: 12px; color: var(--ink-soft); transition: transform 0.15s ease; }
  .chap-score-card.open .chap-caret { transform: rotate(180deg); }

  .step { display: none; }
  .step.active { display: block; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 30px 0 24px; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Checklist d'intégration <span>numérique</span></h1>
  <p class="lead" id="lead-text">Faites le point sur ce que vous savez déjà faire avec les outils numériques de l'AP-HP, chapitre par chapitre.</p>
  <p class="status-note" id="status-note">Connexion à Grist en cours…</p>

  <!-- STEP 0 : IDENTIFICATION -->
  <div class="step active" id="step-0">
    <div class="id-form">
      <div class="field">
        <label for="input-nom">Nom / Prénom</label>
        <input type="text" id="input-nom" placeholder="Ex : Camille Dupont">
      </div>
      <div class="field">
        <label for="input-metier">Métier</label>
        <select id="input-metier"><option value="">Choisir…</option></select>
      </div>
      <button class="btn-primary" id="btn-start" disabled>Commencer</button>
    </div>
  </div>

  <!-- STEP 1 : CHECKLIST -->
  <div class="step" id="step-1">
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
    <p class="progress-label" id="progress-label">0 / 0 répondues</p>
    <div id="checklist-content"></div>
    <div class="submit-bar">
      <span class="remaining" id="remaining-note"></span>
      <button class="btn-primary" id="btn-submit" disabled>Valider mes réponses</button>
    </div>
  </div>

  <!-- STEP 2 : RESULTATS -->
  <div class="step" id="step-2">
    <div class="score-global">
      <span class="big" id="score-global-num">0</span>
      <span class="of" id="score-global-of">/ 0 compétences maîtrisées</span>
    </div>
    <div id="results-content"></div>
    <button class="btn-secondary" id="btn-download-pdf" style="margin-top:22px;">Télécharger mon bilan (PDF)</button>
  </div>

</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>

function esc(s) {
  var d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : String(s);
  return d.innerHTML;
}

var PALETTE = [
  { bg: '#DCEBFC', deep: '#2563EB' },
  { bg: '#DFF3F5', deep: '#0EA5A8' },
  { bg: '#E3E9FC', deep: '#4C5FD9' },
  { bg: '#D9F0FA', deep: '#0891B2' },
  { bg: '#E6EEFC', deep: '#1D4ED8' },
  { bg: '#DCF4F1', deep: '#0D9488' },
  { bg: '#DDE7FB', deep: '#3B5BDB' },
  { bg: '#D6EEF8', deep: '#0369A1' }
];

var chapitresList = [];       // [{id (chapitre text, e.g. "C1"), nom, contexte, colorIndex}]
var competencesByChap = {};   // chapitre text -> [{id (row id in Checklist_Reference), nom}]
var metiersList = [];         // [nom]
var responses = {};           // competenceId -> 'Oui' | 'Non'
var totalCompetences = 0;

async function loadReferentiel() {
  var statusNote = document.getElementById('status-note');
  try {
    var checklist = await grist.docApi.fetchTable('Checklist_reference2');
    var metiersTable = await grist.docApi.fetchTable('Metiers');

    chapitresList = [];
    var chapSeen = {};
    competencesByChap = {};
    totalCompetences = 0;

    for (var j = 0; j < checklist.id.length; j++) {
      var chapKey = checklist.Chapitre[j];
      var contexte = checklist.Contexte[j];
      var capacite = checklist.Capacite[j];

      if (!chapSeen.hasOwnProperty(chapKey)) {
        chapSeen[chapKey] = true;
        chapitresList.push({
          id: chapKey,
          nom: chapKey,
          contexte: contexte,
          colorIndex: chapitresList.length
        });
      }

      var lien = checklist.Lien_formation ? checklist.Lien_formation[j] : '';
      var compObj = { id: checklist.id[j], nom: capacite, lien: lien };
      if (!competencesByChap[chapKey]) competencesByChap[chapKey] = [];
      competencesByChap[chapKey].push(compObj);
      totalCompetences++;
    }

    metiersList = [];
    for (var m = 0; m < metiersTable.id.length; m++) {
      metiersList.push(metiersTable.Nom[m]);
    }
    var metierSelect = document.getElementById('input-metier');
    metiersList.forEach(function (nom) {
      var opt = document.createElement('option');
      opt.value = nom;
      opt.textContent = nom;
      metierSelect.appendChild(opt);
    });

    statusNote.textContent = totalCompetences + ' capacités réparties sur ' + chapitresList.length + ' chapitres.';

  } catch (err) {
    statusNote.textContent = 'Erreur de connexion aux données Grist : ' + err.message;
  }
}

function goToStep(n) {
  document.querySelectorAll('.step').forEach(function (el) { el.classList.remove('active'); });
  document.getElementById('step-' + n).classList.add('active');
}

function checkStartEnabled() {
  var nom = document.getElementById('input-nom').value.trim();
  var metier = document.getElementById('input-metier').value;
  document.getElementById('btn-start').disabled = !(nom && metier);
}

function buildChecklist() {
  var container = document.getElementById('checklist-content');
  container.innerHTML = '';

  chapitresList.forEach(function (chap) {
    var comps = competencesByChap[chap.id] || [];
    if (!comps.length) return;

    var color = PALETTE[chap.colorIndex % PALETTE.length];

    var themeGroup = document.createElement('div');
    themeGroup.className = 'theme-group';

    var themeTitle = document.createElement('div');
    themeTitle.className = 'theme-title';
    themeTitle.innerHTML = '<span class="theme-dot" style="background:' + color.deep + '"></span>' + esc(chap.nom) + ' — ' + esc(chap.contexte);
    themeGroup.appendChild(themeTitle);

    var chapBlock = document.createElement('div');
    chapBlock.className = 'chap-block';
    chapBlock.style.borderLeftColor = color.deep;

    comps.forEach(function (comp) {
      var row = document.createElement('div');
      row.className = 'comp-row';
      row.id = 'row-' + comp.id;

      var label = document.createElement('span');
      label.className = 'comp-label';
      label.textContent = 'Je sais : ' + comp.nom;
      row.appendChild(label);

      var toggleGroup = document.createElement('div');
      toggleGroup.className = 'toggle-group';

      var btnOui = document.createElement('button');
      btnOui.type = 'button';
      btnOui.className = 'toggle-btn oui';
      btnOui.textContent = 'Oui';
      btnOui.addEventListener('click', function () { setResponse(comp.id, 'Oui'); });

      var btnNon = document.createElement('button');
      btnNon.type = 'button';
      btnNon.className = 'toggle-btn non';
      btnNon.textContent = 'Non';
      btnNon.addEventListener('click', function () { setResponse(comp.id, 'Non'); });

      toggleGroup.appendChild(btnOui);
      toggleGroup.appendChild(btnNon);
      row.appendChild(toggleGroup);

      chapBlock.appendChild(row);
    });

    themeGroup.appendChild(chapBlock);
    container.appendChild(themeGroup);
  });
}

function setResponse(compId, value) {
  responses[compId] = value;

  var row = document.getElementById('row-' + compId);
  row.classList.remove('answered-oui', 'answered-non');
  row.classList.add(value === 'Oui' ? 'answered-oui' : 'answered-non');
  row.querySelector('.toggle-btn.oui').classList.toggle('active', value === 'Oui');
  row.querySelector('.toggle-btn.non').classList.toggle('active', value === 'Non');

  updateProgress();
}

function updateProgress() {
  var answered = Object.keys(responses).length;
  var pct = totalCompetences ? Math.round((answered / totalCompetences) * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = answered + ' / ' + totalCompetences + ' répondues';

  var remaining = totalCompetences - answered;
  document.getElementById('remaining-note').textContent = remaining > 0 ? (remaining + ' compétence(s) restante(s)') : 'Toutes les compétences sont répondues.';
  document.getElementById('btn-submit').disabled = remaining > 0;
}

async function submitResponses() {
  var btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  var nom = document.getElementById('input-nom').value.trim();
  var metier = document.getElementById('input-metier').value;
  var now = new Date();

  var compIds = Object.keys(responses).map(function (k) { return parseInt(k, 10); });
  var noms = compIds.map(function () { return nom; });
  var metiers = compIds.map(function () { return metier; });
  var reponses = compIds.map(function (id) { return responses[id]; });
  var dates = compIds.map(function () { return now.getTime() / 1000; });
  var rowIds = compIds.map(function () { return null; });

  try {
    await grist.docApi.applyUserActions([
      ['BulkAddRecord', 'Reponses_Checklist', rowIds, {
        Nom: noms,
        Metier: metiers,
        Competence: compIds,
        Reponse: reponses,
        Date_reponse: dates
      }]
    ]);
    showResults();
  } catch (err) {
    btn.textContent = 'Valider mes réponses';
    btn.disabled = false;
    alert('Erreur lors de l\'enregistrement dans Grist : ' + err.message);
  }
}

var lastScoreSummary = null; // { totalOui, totalRepondu, perChapitre: [{nom, contexte, ouiCount, total, nonList}] }

function hexToRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

function buildPdfBlob(nom, metier) {
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var marginLeft = 16;
  var marginRight = 16;
  var contentWidth = pageWidth - marginLeft - marginRight;
  var y = 0;

  function ink(r, g, b) { doc.setTextColor(r, g, b); }
  function fill(r, g, b) { doc.setFillColor(r, g, b); }
  function stroke(r, g, b) { doc.setDrawColor(r, g, b); }

  function ensureSpace(needed) {
    if (y + needed > pageHeight - 22) {
      doc.addPage();
      y = 24;
    }
  }

  // ===== BANDEAU D'EN-TETE =====
  fill(37, 99, 235);
  doc.rect(0, 0, pageWidth, 38, 'F');

  doc.setFont('times', 'bold');
  doc.setFontSize(20);
  ink(255, 255, 255);
  doc.text("Bilan — Checklist d'intégration numérique", marginLeft, 19);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  ink(222, 233, 253);
  doc.text('Référentiel compétences numériques — AP-HP', marginLeft, 27);

  y = 52;

  // ===== CARTE D'IDENTITE =====
  fill(222, 233, 253);
  doc.roundedRect(marginLeft, y, contentWidth, 26, 3, 3, 'F');

  doc.setFont('times', 'bold');
  doc.setFontSize(14);
  ink(22, 35, 61);
  doc.text(nom || '—', marginLeft + 7, y + 11);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  ink(92, 107, 133);
  doc.text((metier || '—') + '   •   ' + new Date().toLocaleDateString('fr-FR'), marginLeft + 7, y + 19);

  if (lastScoreSummary) {
    doc.setFont('times', 'bold');
    doc.setFontSize(21);
    ink(37, 99, 235);
    doc.text(lastScoreSummary.totalOui + ' / ' + lastScoreSummary.totalRepondu, marginLeft + contentWidth - 7, y + 14, { align: 'right' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(7.5);
    ink(92, 107, 133);
    doc.text('capacités maîtrisées', marginLeft + contentWidth - 7, y + 20, { align: 'right' });
  }

  y += 38;

  if (lastScoreSummary) {
    lastScoreSummary.perChapitre.forEach(function (c, idx) {
      ensureSpace(28);

      var rgb = hexToRgb(PALETTE[idx % PALETTE.length].deep);

      // liseré de couleur + titre du chapitre
      fill(rgb[0], rgb[1], rgb[2]);
      doc.rect(marginLeft, y, 2.2, 10, 'F');

      doc.setFont('times', 'bold');
      doc.setFontSize(13);
      ink(22, 35, 61);
      var titleLines = doc.splitTextToSize(c.nom, contentWidth - 46);
      doc.text(titleLines, marginLeft + 7, y + 6);

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      ink(92, 107, 133);
      doc.text(c.ouiCount + ' / ' + c.total, marginLeft + contentWidth, y + 6, { align: 'right' });

      y += Math.max(titleLines.length * 5.5, 8) + 4;

      // barre de progression
      fill(220, 230, 245);
      doc.roundedRect(marginLeft + 7, y, contentWidth - 7, 2.4, 1.2, 1.2, 'F');
      var pct = c.total ? (c.ouiCount / c.total) : 0;
      fill(rgb[0], rgb[1], rgb[2]);
      doc.roundedRect(marginLeft + 7, y, Math.max((contentWidth - 7) * pct, 2.4), 2.4, 1.2, 1.2, 'F');
      y += 11;

      if (c.nonList.length) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(9);
        ink(220, 38, 38);
        doc.text('À TRAVAILLER (' + c.nonList.length + ')', marginLeft + 7, y);
        y += 7;

        c.nonList.forEach(function (item) {
          doc.setFont('helvetica', 'normal');
          doc.setFontSize(10);
          var lines = doc.splitTextToSize(item.nom, contentWidth - 24);
          var textBlockHeight = lines.length * 5.2;
          var boxHeight = textBlockHeight + 14;
          ensureSpace(boxHeight + 5);

          fill(251, 227, 225);
          doc.roundedRect(marginLeft + 7, y, contentWidth - 11, boxHeight, 2.5, 2.5, 'F');

          ink(22, 35, 61);
          doc.text(lines, marginLeft + 11, y + 7);

          doc.setFont('helvetica', 'bold');
          doc.setFontSize(8.5);
          if (item.lien) {
            ink(37, 99, 235);
            doc.textWithLink('Voir la formation >', marginLeft + 11, y + textBlockHeight + 11, { url: item.lien });
          } else {
            ink(140, 150, 165);
            doc.setFont('helvetica', 'normal');
            doc.text('Formation à venir', marginLeft + 11, y + textBlockHeight + 11);
          }
          y += boxHeight + 5;
        });
      }

      y += 10;
    });
  }

  // ===== PIED DE PAGE SUR CHAQUE PAGE =====
  var pageCount = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    stroke(220, 230, 245);
    doc.setLineWidth(0.3);
    doc.line(marginLeft, pageHeight - 14, pageWidth - marginRight, pageHeight - 14);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    ink(92, 107, 133);
    doc.text('Référentiel compétences numériques — AP-HP', marginLeft, pageHeight - 9);
    doc.text('Page ' + p + ' / ' + pageCount, pageWidth - marginRight, pageHeight - 9, { align: 'right' });
  }

  return doc.output('blob');
}

function triggerDownload(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

document.getElementById('btn-download-pdf').addEventListener('click', function () {
  var nom = document.getElementById('input-nom').value.trim();
  var metier = document.getElementById('input-metier').value;
  var blob = buildPdfBlob(nom, metier);
  triggerDownload(blob, 'bilan_checklist.pdf');
});

function showResults() {
  var container = document.getElementById('results-content');
  container.innerHTML = '';

  var totalOui = 0;
  var totalRepondu = Object.keys(responses).length;
  var perChapitre = [];

  chapitresList.forEach(function (chap, cIdx) {
    var comps = competencesByChap[chap.id] || [];
    if (!comps.length) return;

    var ouiCount = 0;
    var nonList = [];
    comps.forEach(function (comp) {
      if (responses[comp.id] === 'Oui') {
        ouiCount++;
        totalOui++;
      } else if (responses[comp.id] === 'Non') {
        nonList.push(comp);
      }
    });

    var color = PALETTE[chap.colorIndex % PALETTE.length];
    var pct = comps.length ? Math.round((ouiCount / comps.length) * 100) : 0;

    var card = document.createElement('div');
    card.className = 'chap-score-card';

    var head = document.createElement('div');
    head.className = 'chap-score-head';
    head.innerHTML =
      '<div><div class="chap-score-name">' + esc(chap.nom) + '</div>' +
      '<div class="chap-score-theme">' + esc(chap.contexte) + '</div></div>' +
      '<div style="display:flex;align-items:center;gap:12px;">' +
      '<span class="chap-score-fraction">' + ouiCount + ' / ' + comps.length + '</span>' +
      (nonList.length ? '<span class="chap-caret">▾</span>' : '') +
      '</div>';
    card.appendChild(head);

    var barOuter = document.createElement('div');
    barOuter.className = 'chap-score-bar-outer';
    var barInner = document.createElement('div');
    barInner.className = 'chap-score-bar-inner';
    barInner.style.width = pct + '%';
    barInner.style.background = color.deep;
    barOuter.appendChild(barInner);
    card.appendChild(barOuter);

    if (nonList.length) {
      var missing = document.createElement('div');
      missing.className = 'chap-missing';
      var missingTitle = document.createElement('p');
      missingTitle.className = 'chap-missing-title';
      missingTitle.textContent = 'À travailler (' + nonList.length + ')';
      missing.appendChild(missingTitle);
      nonList.forEach(function (comp) {
        var pill = document.createElement('div');
        pill.className = 'missing-pill';
        var lienHtml = comp.lien
          ? '<a href="' + esc(comp.lien) + '" target="_blank" rel="noopener" class="missing-pill-link">Voir la formation →</a>'
          : '<span class="missing-pill-link missing-pill-link-soon">Formation à venir</span>';
        pill.innerHTML = '<div>' + esc(comp.nom) + '</div>' + lienHtml;
        missing.appendChild(pill);
      });
      card.appendChild(missing);

      head.style.cursor = 'pointer';
      head.addEventListener('click', function () {
        card.classList.toggle('open');
        missing.classList.toggle('open');
      });
    }

    container.appendChild(card);

    perChapitre.push({
      nom: chap.nom,
      contexte: chap.contexte,
      ouiCount: ouiCount,
      total: comps.length,
      nonList: nonList.map(function (c) { return { nom: c.nom, lien: c.lien }; })
    });
  });

  document.getElementById('score-global-num').textContent = totalOui;
  document.getElementById('score-global-of').textContent = '/ ' + totalRepondu + ' compétences maîtrisées';

  lastScoreSummary = { totalOui: totalOui, totalRepondu: totalRepondu, perChapitre: perChapitre };

  goToStep(2);
}

document.getElementById('input-nom').addEventListener('input', checkStartEnabled);
document.getElementById('input-metier').addEventListener('change', checkStartEnabled);

document.getElementById('btn-start').addEventListener('click', function () {
  buildChecklist();
  updateProgress();
  goToStep(1);
});

document.getElementById('btn-submit').addEventListener('click', submitResponses);

grist.ready({ requiredAccess: 'full' });
loadReferentiel();

</script>
