<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes outils numériques — Référentiel AP-HP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink: #16233D;
    --ink-soft: #5C6B85;
    --line: #DCE6F5;
    --paper: #FFFFFF;
    --bg: #EAF1FC;

    --vermillion: #2563EB;
    --vermillion-soft: #DEE9FD;
    --grey: #9AA9C4;
    --grey-soft: #EDF0F7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E1EBFA; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 1.5rem 0.75rem;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 42%, rgba(255,255,255,0.97) 72%),
      radial-gradient(rgba(13,127,191,0.3) 1px, transparent 1.4px);
    background-size: 100% 100%, 20px 20px;
    background-position: 0 0, 0 0;
    border-radius: 28px;
    padding: 3rem 3.25rem;
    box-shadow: 10px 10px 0 rgba(22,35,61,0.06);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.22;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  h1 span { color: var(--vermillion); }

  p.lead {
    margin: 0 0 26px 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    max-width: 620px;
    line-height: 1.6;
  }

  .status-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px 0; }

  .select-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    padding-top: 22px;
    padding-bottom: 26px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 260px; }
  .field label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  .field select:focus { outline: 2px solid var(--vermillion); outline-offset: 1px; }

  .btn-secondary {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--vermillion);
    background: var(--vermillion-soft);
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .btn-secondary:hover { opacity: 0.85; }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 28px 0 14px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .section-badge.maitriser { background: var(--vermillion); }
  .section-badge.connaitre { background: var(--grey); }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .tool-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--paper);
  }
  .tool-card.maitriser { border-left: 3px solid var(--vermillion); }
  .tool-card.connaitre { border-left: 3px solid var(--grey); }
  .tool-name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .tool-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }

  .empty-note { font-size: 13.5px; color: var(--ink-soft); padding: 20px 0; }

  #results { display: none; }
  #results.active { display: block; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Mes outils <span>numériques</span></h1>
  <p class="lead">Choisissez votre métier pour voir la liste des logiciels et outils numériques que vous utilisez, et téléchargez-la en PDF.</p>
  <p class="status-note" id="status-note">Connexion à Grist en cours…</p>

  <div class="select-bar">
    <div class="field">
      <label for="input-metier">Métier</label>
      <select id="input-metier"><option value="">Choisir…</option></select>
    </div>
    <button class="btn-secondary" id="btn-download-pdf" disabled>Télécharger en PDF</button>
  </div>

  <div id="results">
    <div id="results-content"></div>
  </div>

</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>

function esc(s) {
  var d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : String(s);
  return d.innerHTML;
}

var metiersById = {};      // id -> nom
var outilsById = {};       // id -> { nom, description }
var metierOutilRows = [];  // [{ metierId, outilId, usage }]
var currentMetierNom = '';
var lastDisplayed = { maitriser: [], connaitre: [] };

async function loadData() {
  var statusNote = document.getElementById('status-note');
  try {
    var metiersTable = await grist.docApi.fetchTable('Metiers');
    var outilsTable = await grist.docApi.fetchTable('Outils');
    var metierOutilTable = await grist.docApi.fetchTable('Metier_Outil');

    metiersById = {};
    var metierSelect = document.getElementById('input-metier');
    for (var i = 0; i < metiersTable.id.length; i++) {
      metiersById[metiersTable.id[i]] = metiersTable.Nom[i];
      var opt = document.createElement('option');
      opt.value = metiersTable.id[i];
      opt.textContent = metiersTable.Nom[i];
      metierSelect.appendChild(opt);
    }

    outilsById = {};
    for (var j = 0; j < outilsTable.id.length; j++) {
      outilsById[outilsTable.id[j]] = {
        nom: outilsTable.Nom[j],
        description: outilsTable.Description ? outilsTable.Description[j] : ''
      };
    }

    metierOutilRows = [];
    for (var k = 0; k < metierOutilTable.id.length; k++) {
      metierOutilRows.push({
        metierId: metierOutilTable.Metier[k],
        outilId: metierOutilTable.Outil[k],
        usage: metierOutilTable.Usage[k]
      });
    }

    statusNote.textContent = metierOutilRows.length + ' lignes métier/outil chargées.';
  } catch (err) {
    statusNote.textContent = 'Erreur de connexion aux données Grist : ' + err.message;
  }
}

function showOutilsForMetier(metierId) {
  var results = document.getElementById('results');
  var content = document.getElementById('results-content');
  content.innerHTML = '';

  var rows = metierOutilRows.filter(function (r) { return String(r.metierId) === String(metierId); });

  var maitriser = [];
  var connaitre = [];
  rows.forEach(function (r) {
    var outil = outilsById[r.outilId];
    if (!outil) return;
    if (r.usage === 'À maîtriser') maitriser.push(outil);
    else if (r.usage === 'À connaître') connaitre.push(outil);
  });

  lastDisplayed = { maitriser: maitriser, connaitre: connaitre };

  if (!maitriser.length && !connaitre.length) {
    content.innerHTML = '<p class="empty-note">Aucun outil renseigné pour ce métier pour le moment.</p>';
    results.classList.add('active');
    document.getElementById('btn-download-pdf').disabled = true;
    return;
  }

  function buildSection(title, badgeClass, badgeText, list, cardClass) {
    if (!list.length) return;
    var sectionTitle = document.createElement('div');
    sectionTitle.className = 'section-title';
    sectionTitle.innerHTML = '<span class="section-badge ' + badgeClass + '">' + esc(badgeText) + '</span>' + esc(title);
    content.appendChild(sectionTitle);

    var grid = document.createElement('div');
    grid.className = 'tool-grid';
    list.forEach(function (outil) {
      var card = document.createElement('div');
      card.className = 'tool-card ' + cardClass;
      card.innerHTML =
        '<div class="tool-name">' + esc(outil.nom) + '</div>' +
        '<div class="tool-desc">' + esc(outil.description || '') + '</div>';
      grid.appendChild(card);
    });
    content.appendChild(grid);
  }

  buildSection('Outils à maîtriser', 'maitriser', 'À maîtriser', maitriser, 'maitriser');
  buildSection('Outils à connaître', 'connaitre', 'À connaître', connaitre, 'connaitre');

  results.classList.add('active');
  document.getElementById('btn-download-pdf').disabled = false;
}

document.getElementById('input-metier').addEventListener('change', function () {
  var sel = document.getElementById('input-metier');
  var metierId = sel.value;
  currentMetierNom = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
  if (!metierId) {
    document.getElementById('results').classList.remove('active');
    document.getElementById('btn-download-pdf').disabled = true;
    return;
  }
  showOutilsForMetier(metierId);
});

function hexToRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

function buildPdfBlob(metierNom) {
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var marginLeft = 16;
  var marginRight = 16;
  var contentWidth = pageWidth - marginLeft - marginRight;
  var bottomLimit = pageHeight - 24;
  var y = 0;

  var BLUE = [37, 99, 235];
  var INK = [22, 35, 61];
  var SOFT = [80, 94, 120];
  var GREY = [154, 169, 196];
  var LINE = [220, 230, 245];
  var TILE = [246, 249, 254];
  var BANNER = [234, 241, 252];

  // ----- police Montserrat -----
  var fontsOk = false;
  try {
    doc.addFileToVFS('Montserrat-Regular.ttf', FONT_MONT_REG);
    doc.addFileToVFS('Montserrat-SemiBold.ttf', FONT_MONT_SEMI);
    doc.addFileToVFS('Montserrat-Bold.ttf', FONT_MONT_BOLD);
    doc.addFont('Montserrat-Regular.ttf', 'Montserrat', 'normal');
    doc.addFont('Montserrat-Bold.ttf', 'Montserrat', 'bold');
    doc.addFont('Montserrat-SemiBold.ttf', 'MontserratSemi', 'normal');
    fontsOk = true;
  } catch (e) { fontsOk = false; }

  function font(weight, size) {
    if (fontsOk) {
      if (weight === 'bold') doc.setFont('Montserrat', 'bold');
      else if (weight === 'semi') doc.setFont('MontserratSemi', 'normal');
      else doc.setFont('Montserrat', 'normal');
    } else {
      doc.setFont('helvetica', weight === 'regular' ? 'normal' : 'bold');
    }
    doc.setFontSize(size);
  }
  function ink(c) { doc.setTextColor(c[0], c[1], c[2]); }
  function fill(c) { doc.setFillColor(c[0], c[1], c[2]); }
  function stroke(c) { doc.setDrawColor(c[0], c[1], c[2]); }

  var logoW = 36;
  var logoH = logoW * (182 / 928);

  // ===== EN-TETE =====
  try {
    if (LOGO_APHP_PLACEHOLDER) doc.addImage(LOGO_APHP_PLACEHOLDER, 'PNG', marginLeft, 14, logoW, logoH);
  } catch (e) { /* logo indisponible */ }

  font('regular', 8.5);
  ink(SOFT);
  doc.text(new Date().toLocaleDateString('fr-FR'), pageWidth - marginRight, 18, { align: 'right' });

  font('bold', 29);
  ink(INK);
  doc.text('Mes outils', marginLeft, 44);
  var w1 = doc.getTextWidth('Mes outils ');
  ink(BLUE);
  doc.text('numériques', marginLeft + w1, 44);

  font('regular', 10);
  ink(SOFT);
  doc.text('Référentiel de compétences numériques · AP-HP', marginLeft, 52);

  // ----- bandeau métier -----
  var by = 62, bh = 26;
  fill(BANNER);
  doc.roundedRect(marginLeft, by, contentWidth, bh, 4, 4, 'F');

  font('semi', 7.5);
  ink(SOFT);
  doc.text('VOTRE MÉTIER', marginLeft + 8, by + 9);

  font('bold', 20);
  ink(BLUE);
  doc.text(metierNom || '—', marginLeft + 8, by + 19.5);

  var totalOutils = lastDisplayed.maitriser.length + lastDisplayed.connaitre.length;
  var cx = pageWidth - marginRight - 15, cy = by + bh / 2;
  fill(BLUE);
  doc.circle(cx, cy, 10, 'F');
  doc.setTextColor(255, 255, 255);
  font('bold', 16);
  doc.text(String(totalOutils), cx, cy + 1.2, { align: 'center' });
  font('semi', 6.5);
  doc.text(totalOutils > 1 ? 'outils' : 'outil', cx, cy + 6, { align: 'center' });

  y = by + bh + 16;

  function continuationHeader() {
    font('regular', 8);
    ink(SOFT);
    doc.text('Mes outils numériques · ' + (metierNom || ''), marginLeft, 14);
    stroke(LINE);
    doc.setLineWidth(0.3);
    doc.line(marginLeft, 17, pageWidth - marginRight, 17);
  }
  function newPage() {
    doc.addPage();
    continuationHeader();
    y = 30;
  }
  function ensureSpace(needed) {
    if (y + needed > bottomLimit) newPage();
  }

  var gap = 6;
  var colW = (contentWidth - gap) / 2;
  var padX = 9, padY = 5;
  var textW = colW - padX - 5;

  function measureTile(outil) {
    font('semi', 10.5);
    var nameLines = doc.splitTextToSize(outil.nom, textW);
    font('regular', 8.5);
    var descLines = outil.description ? doc.splitTextToSize(outil.description, textW) : [];
    var h = padY + nameLines.length * 4.8 + (descLines.length ? 2.2 + descLines.length * 4.1 : 0) + padY;
    return { nameLines: nameLines, descLines: descLines, h: h };
  }

  function drawTile(x, ty, th, m, accent) {
    fill(TILE);
    stroke(LINE);
    doc.setLineWidth(0.25);
    doc.roundedRect(x, ty, colW, th, 2.5, 2.5, 'FD');

    fill(accent);
    doc.roundedRect(x + 3.6, ty + 4.5, 1.2, th - 9, 0.6, 0.6, 'F');

    font('semi', 10.5);
    ink(INK);
    doc.text(m.nameLines, x + padX, ty + padY + 3.4);

    if (m.descLines.length) {
      font('regular', 8.5);
      ink(SOFT);
      doc.text(m.descLines, x + padX, ty + padY + 3.4 + m.nameLines.length * 4.8 - 1 + 2.2);
    }
  }

  function renderSection(titleText, accent, list) {
    if (!list.length) return;
    var measured = list.map(measureTile);

    ensureSpace(14 + measured[0].h + 6);

    // pastille titre
    font('semi', 8.5);
    var label = titleText.toUpperCase();
    var pw = doc.getTextWidth(label) + 10;
    fill(accent);
    doc.roundedRect(marginLeft, y - 5, pw, 7.4, 3.7, 3.7, 'F');
    doc.setTextColor(255, 255, 255);
    doc.text(label, marginLeft + 5, y);

    font('regular', 9);
    ink(SOFT);
    doc.text(list.length + (list.length > 1 ? ' outils' : ' outil'), marginLeft + pw + 4, y);

    y += 10;

    for (var i = 0; i < list.length; i += 2) {
      var a = measured[i];
      var b = measured[i + 1];
      var rowH = Math.max(a.h, b ? b.h : 0);
      ensureSpace(rowH + 5);
      drawTile(marginLeft, y, rowH, a, accent);
      if (b) drawTile(marginLeft + colW + gap, y, rowH, b, accent);
      y += rowH + 5;
    }
    y += 8;
  }

  renderSection('À maîtriser', BLUE, lastDisplayed.maitriser);
  renderSection('À connaître', GREY, lastDisplayed.connaitre);

  // ===== PIED DE PAGE =====
  var pageCount = doc.internal.getNumberOfPages();
  for (var p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    stroke(LINE);
    doc.setLineWidth(0.3);
    doc.line(marginLeft, pageHeight - 16, pageWidth - marginRight, pageHeight - 16);

    font('regular', 7.5);
    ink(SOFT);
    doc.text('Référentiel de compétences numériques · AP-HP', marginLeft, pageHeight - 10);
    doc.text('Page ' + p + ' / ' + pageCount, pageWidth - marginRight, pageHeight - 10, { align: 'right' });

    fill(BLUE);
    doc.rect(0, pageHeight - 2.5, pageWidth, 2.5, 'F');
  }

  return doc.output('blob');
}

function triggerDownload(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

document.getElementById('btn-download-pdf').addEventListener('click', function () {
  var blob = buildPdfBlob(currentMetierNom);
  triggerDownload(blob, 'mes_outils_' + (currentMetierNom || 'metier').replace(/\s+/g, '_') + '.pdf');
});

grist.ready({ requiredAccess: 'full' });
loadData();

</script>
