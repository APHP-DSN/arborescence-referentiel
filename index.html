<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arborescence — Référentiel numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #16233D;
    --ink-soft: #5C6B85;
    --line: #DCE6F5;
    --paper: #FFFFFF;
    --bg: #EAF1FC;
    --cream: #E4EEFB;

    --vermillion: #2563EB;
    --vermillion-soft: #DEE9FD;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E1EBFA; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 1.5rem 0.75rem;
  }

  .wrap {
    max-width: 100%;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 28px;
    padding: 3rem 3.25rem;
    box-shadow: 10px 10px 0 rgba(22,35,61,0.06);
  }

  .window { margin-bottom: 3rem; }
  .win-bar { display: none; }

  /* ===== HERO ===== */
  .hero-body { padding: 0; }
  .hero-body h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.22;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  .hero-body h1 span { color: var(--vermillion); }
  .hero-body p {
    margin: 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    max-width: 620px;
    line-height: 1.6;
  }

  /* ===== LEGEND (retirée du HTML, styles conservés inertes) ===== */
  .legend { display: none; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 12px;
    margin-top: 26px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
  }

  .filter-group { display: flex; flex-direction: column; gap: 4px; flex: 1 1 190px; max-width: 240px; min-width: 0; }
  .filter-group label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .filter-group select {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 11px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .filter-group select:focus { outline: 2px solid var(--vermillion); outline-offset: 1px; }

  .filter-reset {
    align-self: flex-end;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--vermillion);
    background: var(--vermillion-soft);
    border: none;
    border-radius: 8px;
    padding: 9px 15px;
    cursor: pointer;
  }
  .filter-reset:hover { opacity: 0.85; }

  .empty-note {
    font-size: 13.5px;
    color: var(--ink-soft);
    padding: 24px 4px;
  }

  /* ===== SECTION LABEL ===== */
  .section-label {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0 0 4px 2px;
    color: var(--ink);
  }
  .section-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 26px 2px; font-weight: 400; }

  /* ===== TREE — rangées horizontales avec défilement ===== */
  .forest {
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-start;
    gap: 34px;
    padding: 4px 4px 14px;
    overflow-x: auto;
  }

  .card {
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--paper);
    padding: 16px 19px;
    display: inline-flex;
    flex-direction: column;
    gap: 8px;
    min-width: 220px;
    flex-shrink: 0;
  }

  .card-tag {
    align-self: flex-start;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    padding: 3px 9px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .card-tag.them { color: var(--paper); }
  .card-tag.chap { background: var(--bg); color: var(--ink-soft); }
  .card-tag.comp { background: var(--bg); color: var(--ink-soft); }
  .card-tag.trans { background: var(--cream); color: var(--vermillion); }

  .them-card {
    border: 1px solid var(--line);
    min-width: 250px;
  }
  .them-mark {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 17px;
    color: var(--paper);
    margin-bottom: 2px;
  }
  .them-card .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    line-height: 1.25;
  }

  .chap-card { min-width: 200px; border-top: 3px solid var(--line); }
  .chap-card .card-title {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
  }

  .trans-card { border: 1px solid var(--line); }
  .trans-card .card-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
  }

  .card-title { color: var(--ink); }
  .card-sub { font-size: 11.5px; color: var(--ink-soft); font-weight: 400; line-height: 1.4; }

  /* Connecteur : du thème vers la rangée de chapitres */
  .theme-block { display: flex; flex-direction: column; flex-shrink: 0; }
  .theme-connector {
    width: 1px;
    height: 22px;
    background: var(--line);
    margin-left: 26px;
  }

  .branch {
    display: flex;
    flex-wrap: nowrap;
    align-items: flex-start;
    gap: 20px;
    position: relative;
    padding-top: 20px;
    overflow-x: auto;
  }
  .branch::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: var(--line);
  }

  .branch-item {
    position: relative;
    padding-top: 0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .branch-item::before {
    content: "";
    position: absolute;
    top: -20px;
    left: 26px;
    width: 1px;
    height: 20px;
    background: var(--line);
  }

  details.comp-details { margin-top: 12px; }
  details.comp-details summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--vermillion);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.comp-details summary::-webkit-details-marker { display: none; }
  details.comp-details summary::before {
    content: "+";
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    border-radius: 6px;
    background: var(--vermillion-soft);
    font-weight: 700;
    font-size: 12px;
    color: var(--vermillion);
  }
  details.comp-details[open] summary::before { content: "–"; }

  .comp-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 12px;
    padding-left: 2px;
    max-width: 260px;
  }

  .comp-pill {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 400;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
  }

  /* ===== TRANSVERSAL ===== */
  .trans-row { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 10px; }

  hr.sep { border: none; border-top: 1px solid var(--line); margin: 44px 2px 4px; }
</style>
</head>
<body>

<div class="wrap">

  <!-- HERO -->
  <div class="window hero">
    <div class="hero-body">
      <h1>Référentiel de compétences numériques et base de connaissance <span>APHP</span></h1>

      <div class="filters">
        <div class="filter-group">
          <label for="filter-them">Thématique</label>
          <select id="filter-them"><option value="">Toutes</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-chap">Chapitre</label>
          <select id="filter-chap"><option value="">Tous</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-comp">Compétence</label>
          <select id="filter-comp"><option value="">Toutes</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-metier">Métier</label>
          <select id="filter-metier"><option value="">Tous</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-outil">Outil</label>
          <select id="filter-outil"><option value="">Tous</option></select>
        </div>
        <div class="filter-group">
          <label for="filter-certif">Certification</label>
          <select id="filter-certif"><option value="">Toutes</option></select>
        </div>
        <button class="filter-reset" id="filter-reset-btn">Réinitialiser</button>
      </div>
    </div>
  </div>

  <!-- DONNÉES GRIST (généré dynamiquement) -->
  <p class="section-label">Référentiel complet</p>
  <p class="section-note" id="status-note">Connexion à Grist en cours…</p>

  <div class="forest" id="live-forest"></div>

</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>

function esc(s) {
  var d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : String(s);
  return d.innerHTML;
}

var PALETTE = [
  { bg: '#DCEBFC', deep: '#2563EB' },
  { bg: '#DFF3F5', deep: '#0EA5A8' },
  { bg: '#E3E9FC', deep: '#4C5FD9' },
  { bg: '#D9F0FA', deep: '#0891B2' },
  { bg: '#E6EEFC', deep: '#1D4ED8' },
  { bg: '#DCF4F1', deep: '#0D9488' },
  { bg: '#DDE7FB', deep: '#3B5BDB' },
  { bg: '#D6EEF8', deep: '#0369A1' }
];

// Données mises en cache après chargement, réutilisées par les filtres
var themesList = [];
var chapitresParTheme = {};
var competencesParChapitre = {};
var allChapitresFlat = [];
var allCompetencesFlat = [];
var competenceIdsByMetierNom = {};
var competenceIdsByOutilNom = {};
var metiersList = [];
var outilsList = [];
var competenceIdsByCertifNom = {};
var certificationsList = [];

function buildThemeCard(theme, chapEntries, colorIndex) {
  var color = PALETTE[colorIndex % PALETTE.length];
  var wrap = document.createElement('div');
  wrap.className = 'theme-block';

  var initiale = (theme.nom || '?').trim().charAt(0).toUpperCase();

  var card = document.createElement('div');
  card.className = 'card them-card';
  card.style.background = color.bg;
  card.style.borderColor = color.bg;
  card.innerHTML =
    '<span class="card-tag them" style="background:' + color.deep + '">Thématique</span>' +
    '<span class="card-title">' + esc(theme.nom) + '</span>';
  wrap.appendChild(card);

  if (chapEntries.length) {
    var connector = document.createElement('div');
    connector.className = 'theme-connector';
    connector.style.background = color.deep;
    connector.style.opacity = '0.4';
    wrap.appendChild(connector);

    var branch = document.createElement('div');
    branch.className = 'branch';

    chapEntries.forEach(function (entry) {
      var chap = entry.chap;
      var comps = entry.comps;

      var item = document.createElement('div');
      item.className = 'branch-item';

      var chapCard = document.createElement('div');
      chapCard.className = 'card chap-card';
      chapCard.style.borderTopColor = color.deep;
      chapCard.innerHTML =
        '<span class="card-tag chap">Chapitre</span>' +
        '<span class="card-title">' + esc(chap.nom) + '</span>';
      item.appendChild(chapCard);

      if (comps.length) {
        var details = document.createElement('details');
        details.className = 'comp-details';
        details.open = comps.length <= 3;
        var summary = document.createElement('summary');
        summary.style.color = color.deep;
        summary.textContent = 'Compétences (' + comps.length + ')';
        details.appendChild(summary);

        var list = document.createElement('div');
        list.className = 'comp-list';
        comps.forEach(function (c) {
          var pill = document.createElement('div');
          pill.className = 'comp-pill';
          pill.textContent = c.nom;
          list.appendChild(pill);
        });
        details.appendChild(list);
        item.appendChild(details);
      }

      branch.appendChild(item);
    });

    wrap.appendChild(branch);
  }

  return wrap;
}

function getFilteredThemes(selThemeId, selChapId, selCompId, selMetierNom, selOutilNom, selCertifNom) {
  var anyFilter = !!(selThemeId || selChapId || selCompId || selMetierNom || selOutilNom || selCertifNom);
  var metierIdSet = selMetierNom ? (competenceIdsByMetierNom[selMetierNom] || new Set()) : null;
  var outilIdSet = selOutilNom ? (competenceIdsByOutilNom[selOutilNom] || new Set()) : null;
  var certifIdSet = selCertifNom ? (competenceIdsByCertifNom[selCertifNom] || new Set()) : null;
  var out = [];

  themesList.forEach(function (theme) {
    if (selThemeId && String(theme.id) !== selThemeId) return;

    var chapCandidates = chapitresParTheme[theme.id] || [];
    var chapResults = [];

    chapCandidates.forEach(function (chap) {
      if (selChapId && String(chap.id) !== selChapId) return;

      var comps = competencesParChapitre[chap.id] || [];
      if (selCompId) {
        comps = comps.filter(function (c) { return String(c.id) === selCompId; });
      }
      if (metierIdSet) {
        comps = comps.filter(function (c) { return metierIdSet.has(c.id); });
      }
      if (outilIdSet) {
        comps = comps.filter(function (c) { return outilIdSet.has(c.id); });
      }
      if (certifIdSet) {
        comps = comps.filter(function (c) { return certifIdSet.has(c.id); });
      }
      if ((selCompId || metierIdSet || outilIdSet || certifIdSet) && comps.length === 0) return;

      chapResults.push({ chap: chap, comps: comps });
    });

    if (anyFilter && chapResults.length === 0) return;
    out.push({ theme: theme, chapitres: chapResults });
  });

  return out;
}

function renderForest() {
  var forest = document.getElementById('live-forest');
  var selThemeId = document.getElementById('filter-them').value;
  var selChapId = document.getElementById('filter-chap').value;
  var selCompId = document.getElementById('filter-comp').value;
  var selMetierNom = document.getElementById('filter-metier').value;
  var selOutilNom = document.getElementById('filter-outil').value;
  var selCertifNom = document.getElementById('filter-certif').value;

  var filtered = getFilteredThemes(selThemeId, selChapId, selCompId, selMetierNom, selOutilNom, selCertifNom);

  forest.innerHTML = '';
  if (filtered.length === 0) {
    var note = document.createElement('p');
    note.className = 'empty-note';
    note.textContent = 'Aucun résultat pour cette combinaison de filtres.';
    forest.appendChild(note);
    return;
  }

  filtered.forEach(function (entry, idx) {
    forest.appendChild(buildThemeCard(entry.theme, entry.chapitres, idx));
  });
}

function populateSelect(selectEl, items, placeholder) {
  var current = selectEl.value;
  selectEl.innerHTML = '';
  var optAll = document.createElement('option');
  optAll.value = '';
  optAll.textContent = placeholder;
  selectEl.appendChild(optAll);
  items.forEach(function (it) {
    var opt = document.createElement('option');
    opt.value = String(it.id);
    opt.textContent = it.nom;
    selectEl.appendChild(opt);
  });
  if (current && selectEl.querySelector('option[value="' + current + '"]')) {
    selectEl.value = current;
  }
}

async function loadReferentiel() {
  var statusNote = document.getElementById('status-note');

  try {
    var themes = await grist.docApi.fetchTable('Table1');
    var chapitres = await grist.docApi.fetchTable('Chapitres');
    var competences = await grist.docApi.fetchTable('Referentiel_dynamique3');

    themesList = [];
    for (var k = 0; k < themes.id.length; k++) {
      themesList.push({ id: themes.id[k], nom: themes.Thematique[k] });
    }

    chapitresParTheme = {};
    allChapitresFlat = [];
    for (var i = 0; i < chapitres.id.length; i++) {
      var themeId = chapitres.Thematiques[i];
      var chapObj = { id: chapitres.id[i], nom: chapitres.Chapitre[i], certifId: chapitres.Certification[i] };
      if (!chapitresParTheme[themeId]) chapitresParTheme[themeId] = [];
      chapitresParTheme[themeId].push(chapObj);
      allChapitresFlat.push(chapObj);
    }

    competencesParChapitre = {};
    allCompetencesFlat = [];
    for (var j = 0; j < competences.id.length; j++) {
      var chapId = competences.Chapitre[j];
      var compObj = { id: competences.id[j], nom: competences.Competence_numerique[j] };
      if (!competencesParChapitre[chapId]) competencesParChapitre[chapId] = [];
      competencesParChapitre[chapId].push(compObj);
      allCompetencesFlat.push(compObj);
    }

    populateSelect(document.getElementById('filter-them'), themesList, 'Toutes');
    populateSelect(document.getElementById('filter-chap'), allChapitresFlat, 'Tous');
    populateSelect(document.getElementById('filter-comp'), allCompetencesFlat, 'Toutes');

    var matriceMetiers = await grist.docApi.fetchTable('Matrice_metiers_competences');
    var matriceLogiciels = await grist.docApi.fetchTable('Matrice_logiciels_competences');
    var metiersTable = await grist.docApi.fetchTable('Metiers');
    var outilsTable = await grist.docApi.fetchTable('Outils');

    var metierIdToNom = {};
    metiersList = [];
    for (var mm = 0; mm < metiersTable.id.length; mm++) {
      metierIdToNom[metiersTable.id[mm]] = metiersTable.Nom[mm];
      metiersList.push({ id: metiersTable.Nom[mm], nom: metiersTable.Nom[mm] });
    }

    var outilIdToNom = {};
    outilsList = [];
    for (var oo = 0; oo < outilsTable.id.length; oo++) {
      outilIdToNom[outilsTable.id[oo]] = outilsTable.Nom[oo];
      outilsList.push({ id: outilsTable.Nom[oo], nom: outilsTable.Nom[oo] });
    }

    competenceIdsByMetierNom = {};
    for (var m = 0; m < matriceMetiers.id.length; m++) {
      var compRefM = matriceMetiers.Competence_numerique[m];
      var metierRefs = matriceMetiers.Metiers[m] || [];
      metierRefs.forEach(function (mid) {
        var nom = metierIdToNom[mid];
        if (!nom) return;
        if (!competenceIdsByMetierNom[nom]) competenceIdsByMetierNom[nom] = new Set();
        competenceIdsByMetierNom[nom].add(compRefM);
      });
    }

    competenceIdsByOutilNom = {};
    for (var l = 0; l < matriceLogiciels.id.length; l++) {
      var compRefL = matriceLogiciels.Competence_numerique[l];
      var outilRefs = matriceLogiciels.Logiciels[l] || [];
      outilRefs.forEach(function (oid) {
        var nom = outilIdToNom[oid];
        if (!nom) return;
        if (!competenceIdsByOutilNom[nom]) competenceIdsByOutilNom[nom] = new Set();
        competenceIdsByOutilNom[nom].add(compRefL);
      });
    }

    var certificationsTable = await grist.docApi.fetchTable('Certifications');
    var certifIdToNom = {};
    certificationsList = [];
    for (var cc = 0; cc < certificationsTable.id.length; cc++) {
      certifIdToNom[certificationsTable.id[cc]] = certificationsTable.Nom[cc];
      certificationsList.push({ id: certificationsTable.Nom[cc], nom: certificationsTable.Nom[cc] });
    }

    competenceIdsByCertifNom = {};
    allChapitresFlat.forEach(function (chap) {
      if (!chap.certifId) return;
      var nomCertif = certifIdToNom[chap.certifId];
      if (!nomCertif) return;
      var comps = competencesParChapitre[chap.id] || [];
      if (!competenceIdsByCertifNom[nomCertif]) competenceIdsByCertifNom[nomCertif] = new Set();
      comps.forEach(function (c) { competenceIdsByCertifNom[nomCertif].add(c.id); });
    });

    populateSelect(document.getElementById('filter-metier'), metiersList, 'Tous');
    populateSelect(document.getElementById('filter-outil'), outilsList, 'Tous');
    populateSelect(document.getElementById('filter-certif'), certificationsList, 'Toutes');

    renderForest();

    statusNote.textContent = themes.id.length + ' thématiques, ' + chapitres.id.length + ' chapitres, ' + competences.id.length + ' compétences — données en direct depuis Grist.';

  } catch (err) {
    statusNote.textContent = 'Erreur de connexion aux données Grist : ' + err.message;
  }
}

document.getElementById('filter-them').addEventListener('change', renderForest);
document.getElementById('filter-chap').addEventListener('change', renderForest);
document.getElementById('filter-comp').addEventListener('change', renderForest);
document.getElementById('filter-metier').addEventListener('change', renderForest);
document.getElementById('filter-outil').addEventListener('change', renderForest);
document.getElementById('filter-certif').addEventListener('change', renderForest);
document.getElementById('filter-reset-btn').addEventListener('click', function () {
  document.getElementById('filter-them').value = '';
  document.getElementById('filter-chap').value = '';
  document.getElementById('filter-comp').value = '';
  document.getElementById('filter-metier').value = '';
  document.getElementById('filter-outil').value = '';
  document.getElementById('filter-certif').value = '';
  renderForest();
});

grist.ready({ requiredAccess: 'read table' });
grist.onRecords(loadReferentiel);
loadReferentiel();

</script>

</body>
</html>
