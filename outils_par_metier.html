<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes outils numériques — Référentiel AP-HP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink: #16233D;
    --ink-soft: #5C6B85;
    --line: #DCE6F5;
    --paper: #FFFFFF;
    --bg: #EAF1FC;

    --vermillion: #2563EB;
    --vermillion-soft: #DEE9FD;
    --grey: #9AA9C4;
    --grey-soft: #EDF0F7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E1EBFA; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--ink);
    padding: 1.5rem 0.75rem;
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    background-color: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 42%, rgba(255,255,255,0.97) 72%),
      radial-gradient(rgba(13,127,191,0.3) 1px, transparent 1.4px);
    background-size: 100% 100%, 20px 20px;
    background-position: 0 0, 0 0;
    border-radius: 28px;
    padding: 3rem 3.25rem;
    box-shadow: 10px 10px 0 rgba(22,35,61,0.06);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 28px;
    line-height: 1.22;
    margin: 0 0 10px 0;
    color: var(--ink);
  }
  h1 span { color: var(--vermillion); }

  p.lead {
    margin: 0 0 26px 0;
    font-size: 14px;
    font-weight: 400;
    color: var(--ink-soft);
    max-width: 620px;
    line-height: 1.6;
  }

  .status-note { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px 0; }

  .select-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    padding-top: 22px;
    padding-bottom: 26px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; flex: 1 1 260px; }
  .field label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .field select {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  .field select:focus { outline: 2px solid var(--vermillion); outline-offset: 1px; }

  .btn-secondary {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--vermillion);
    background: var(--vermillion-soft);
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .btn-secondary:hover { opacity: 0.85; }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }

  .section-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 28px 0 14px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-badge {
    font-size: 10.5px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .section-badge.maitriser { background: var(--vermillion); }
  .section-badge.connaitre { background: var(--grey); }

  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 12px;
  }
  .tool-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    background: var(--paper);
  }
  .tool-card.maitriser { border-left: 3px solid var(--vermillion); }
  .tool-card.connaitre { border-left: 3px solid var(--grey); }
  .tool-name {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink);
    margin-bottom: 4px;
  }
  .tool-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.4; }

  .empty-note { font-size: 13.5px; color: var(--ink-soft); padding: 20px 0; }

  #results { display: none; }
  #results.active { display: block; }
</style>
</head>
<body>

<div class="wrap">

  <h1>Mes outils <span>numériques</span></h1>
  <p class="lead">Choisissez votre métier pour voir la liste des logiciels et outils numériques que vous utilisez, et téléchargez-la en PDF.</p>
  <p class="status-note" id="status-note">Connexion à Grist en cours…</p>

  <div class="select-bar">
    <div class="field">
      <label for="input-metier">Métier</label>
      <select id="input-metier"><option value="">Choisir…</option></select>
    </div>
    <button class="btn-secondary" id="btn-download-pdf" disabled>Télécharger en PDF</button>
  </div>

  <div id="results">
    <div id="results-content"></div>
  </div>

</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>

function esc(s) {
  var d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : String(s);
  return d.innerHTML;
}

var metiersById = {};      // id -> nom
var outilsById = {};       // id -> { nom, description }
var metierOutilRows = [];  // [{ metierId, outilId, usage }]
var currentMetierNom = '';
var lastDisplayed = { maitriser: [], connaitre: [] };

async function loadData() {
  var statusNote = document.getElementById('status-note');
  try {
    var metiersTable = await grist.docApi.fetchTable('Metiers');
    var outilsTable = await grist.docApi.fetchTable('Outils');
    var metierOutilTable = await grist.docApi.fetchTable('Metier_Outil');

    metiersById = {};
    var metierSelect = document.getElementById('input-metier');
    for (var i = 0; i < metiersTable.id.length; i++) {
      metiersById[metiersTable.id[i]] = metiersTable.Nom[i];
      var opt = document.createElement('option');
      opt.value = metiersTable.id[i];
      opt.textContent = metiersTable.Nom[i];
      metierSelect.appendChild(opt);
    }

    outilsById = {};
    for (var j = 0; j < outilsTable.id.length; j++) {
      outilsById[outilsTable.id[j]] = {
        nom: outilsTable.Nom[j],
        description: outilsTable.Description ? outilsTable.Description[j] : ''
      };
    }

    metierOutilRows = [];
    for (var k = 0; k < metierOutilTable.id.length; k++) {
      metierOutilRows.push({
        metierId: metierOutilTable.Metier[k],
        outilId: metierOutilTable.Outil[k],
        usage: metierOutilTable.Usage[k]
      });
    }

    statusNote.textContent = metierOutilRows.length + ' lignes métier/outil chargées.';
  } catch (err) {
    statusNote.textContent = 'Erreur de connexion aux données Grist : ' + err.message;
  }
}

function showOutilsForMetier(metierId) {
  var results = document.getElementById('results');
  var content = document.getElementById('results-content');
  content.innerHTML = '';

  var rows = metierOutilRows.filter(function (r) { return String(r.metierId) === String(metierId); });

  var maitriser = [];
  var connaitre = [];
  rows.forEach(function (r) {
    var outil = outilsById[r.outilId];
    if (!outil) return;
    if (r.usage === 'À maîtriser') maitriser.push(outil);
    else if (r.usage === 'À connaître') connaitre.push(outil);
  });

  lastDisplayed = { maitriser: maitriser, connaitre: connaitre };

  if (!maitriser.length && !connaitre.length) {
    content.innerHTML = '<p class="empty-note">Aucun outil renseigné pour ce métier pour le moment.</p>';
    results.classList.add('active');
    document.getElementById('btn-download-pdf').disabled = true;
    return;
  }

  function buildSection(title, badgeClass, badgeText, list, cardClass) {
    if (!list.length) return;
    var sectionTitle = document.createElement('div');
    sectionTitle.className = 'section-title';
    sectionTitle.innerHTML = '<span class="section-badge ' + badgeClass + '">' + esc(badgeText) + '</span>' + esc(title);
    content.appendChild(sectionTitle);

    var grid = document.createElement('div');
    grid.className = 'tool-grid';
    list.forEach(function (outil) {
      var card = document.createElement('div');
      card.className = 'tool-card ' + cardClass;
      card.innerHTML =
        '<div class="tool-name">' + esc(outil.nom) + '</div>' +
        '<div class="tool-desc">' + esc(outil.description || '') + '</div>';
      grid.appendChild(card);
    });
    content.appendChild(grid);
  }

  buildSection('Outils à maîtriser', 'maitriser', 'À maîtriser', maitriser, 'maitriser');
  buildSection('Outils à connaître', 'connaitre', 'À connaître', connaitre, 'connaitre');

  results.classList.add('active');
  document.getElementById('btn-download-pdf').disabled = false;
}

document.getElementById('input-metier').addEventListener('change', function () {
  var sel = document.getElementById('input-metier');
  var metierId = sel.value;
  currentMetierNom = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : '';
  if (!metierId) {
    document.getElementById('results').classList.remove('active');
    document.getElementById('btn-download-pdf').disabled = true;
    return;
  }
  showOutilsForMetier(metierId);
});

function hexToRgb(h) {
  h = h.replace('#', '');
  return [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
}

function buildPdfBlob(metierNom) {
  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();
  var pageWidth = doc.internal.pageSize.getWidth();
  var pageHeight = doc.internal.pageSize.getHeight();
  var marginLeft = 16;
  var marginRight = 16;
  var contentWidth = pageWidth - marginLeft - marginRight;
  var y = 0;

  function ink(r, g, b) { doc.setTextColor(r, g, b); }
  function fill(r, g, b) { doc.setFillColor(r, g, b); }
  function stroke(r, g, b) { doc.setDrawColor(r, g, b); }

  // ===== (1) MOTIF A POINTS EN FOND DE PAGE =====
  function drawDotBackground() {
    fill(222, 233, 253);
    var step = 6;
    for (var dx = 10; dx < pageWidth - 5; dx += step) {
      for (var dy = 44; dy < pageHeight - 10; dy += step) {
        doc.circle(dx, dy, 0.28, 'F');
      }
    }
  }

  // ===== (7) CADRE FIN AUTOUR DE LA PAGE =====
  function drawPageFrame() {
    stroke(190, 210, 245);
    doc.setLineWidth(0.4);
    doc.roundedRect(5, 5, pageWidth - 10, pageHeight - 10, 3, 3, 'S');
  }

  // ===== OMBRE LEGERE SOUS UN BLOC (3) =====
  function shadowRect(x, yPos, w, h, r) {
    fill(214, 222, 238);
    doc.roundedRect(x + 1, yPos + 1, w, h, r, r, 'F');
  }

  function ensureSpace(needed) {
    if (y + needed > pageHeight - 22) {
      doc.addPage();
      drawDotBackground();
      y = 24;
    }
  }

  drawDotBackground();

  // ===== (4) BANDEAU D'EN-TETE, DEGRADE SIMULE + BAS ARRONDI =====
  var bandH = 38;
  var stripes = 6;
  for (var s = 0; s < stripes; s++) {
    var t = s / (stripes - 1);
    var r = Math.round(37 + (29 - 37) * t);
    var g = Math.round(99 + (78 - 99) * t);
    var b = Math.round(235 + (216 - 235) * t);
    fill(r, g, b);
    doc.rect(0, (bandH / stripes) * s, pageWidth, bandH / stripes + 0.5, 'F');
  }
  // vague blanche qui adoucit le bas du bandeau
  fill(255, 255, 255);
  doc.ellipse(pageWidth / 2, bandH + 7, pageWidth * 0.62, 8, 'F');

  doc.setFont('times', 'bold');
  doc.setFontSize(20);
  ink(255, 255, 255);
  doc.text('Mes outils numériques', marginLeft, 19);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  ink(222, 233, 253);
  doc.text('Référentiel compétences numériques — AP-HP', marginLeft, 27);

  y = 52;

  // ===== CARTE METIER =====
  shadowRect(marginLeft, y, contentWidth, 20, 3);
  fill(222, 233, 253);
  doc.roundedRect(marginLeft, y, contentWidth, 20, 3, 3, 'F');

  doc.setFont('times', 'bold');
  doc.setFontSize(14);
  ink(22, 35, 61);
  doc.text(metierNom || '—', marginLeft + 7, y + 9);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  ink(92, 107, 133);
  doc.text(new Date().toLocaleDateString('fr-FR'), marginLeft + 7, y + 16);

  var totalOutils = lastDisplayed.maitriser.length + lastDisplayed.connaitre.length;
  doc.setFont('times', 'bold');
  doc.setFontSize(16);
  ink(37, 99, 235);
  doc.text(String(totalOutils), marginLeft + contentWidth - 7, y + 12, { align: 'right' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  ink(92, 107, 133);
  doc.text('outils', marginLeft + contentWidth - 7, y + 17, { align: 'right' });

  y += 32;

  // ===== (6) SEPARATEUR DECORATIF ENTRE SECTIONS =====
  function drawDivider() {
    ensureSpace(10);
    stroke(190, 210, 245);
    doc.setLineWidth(0.4);
    doc.setLineDashPattern([1, 1.4], 0);
    doc.line(marginLeft, y, marginLeft + contentWidth, y);
    doc.setLineDashPattern([], 0);
    fill(37, 99, 235);
    doc.circle(marginLeft + contentWidth / 2, y, 1.1, 'F');
    y += 8;
  }

  var firstSection = true;

  function renderSection(titleText, badgeRgb, list) {
    if (!list.length) return;
    if (!firstSection) drawDivider();
    firstSection = false;

    ensureSpace(16);

    fill(badgeRgb[0], badgeRgb[1], badgeRgb[2]);
    doc.roundedRect(marginLeft, y, 2.2, 10, 1, 1, 'F');

    doc.setFont('times', 'bold');
    doc.setFontSize(13);
    ink(22, 35, 61);
    doc.text(titleText + ' (' + list.length + ')', marginLeft + 7, y + 7);
    y += 14;

    list.forEach(function (outil) {
      var nameLines = doc.splitTextToSize(outil.nom, contentWidth - 20);
      var descLines = outil.description ? doc.splitTextToSize(outil.description, contentWidth - 20) : [];
      var boxHeight = nameLines.length * 5 + descLines.length * 4.4 + 10;
      ensureSpace(boxHeight + 6);

      shadowRect(marginLeft + 7, y, contentWidth - 11, boxHeight, 2.5);

      fill(248, 250, 253);
      stroke(220, 230, 245);
      doc.setLineWidth(0.3);
      doc.roundedRect(marginLeft + 7, y, contentWidth - 11, boxHeight, 2.5, 2.5, 'FD');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10.5);
      ink(22, 35, 61);
      doc.text(nameLines, marginLeft + 11, y + 7);

      if (descLines.length) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        ink(92, 107, 133);
        doc.text(descLines, marginLeft + 11, y + 7 + nameLines.length * 5);
      }

      y += boxHeight + 5;
    });

    y += 5;
  }

  renderSection('À maîtriser', hexToRgb('#2563EB'), lastDisplayed.maitriser);
  renderSection('À connaître', hexToRgb('#9AA9C4'), lastDisplayed.connaitre);

  // ===== PIED DE PAGE + CADRE SUR CHAQUE PAGE =====
  var pageCount = doc.internal.getNumberOfPages();
  var logoW = 20;
  var logoH = logoW * (182 / 928);
  for (var p = 1; p <= pageCount; p++) {
    doc.setPage(p);
    drawPageFrame();

    stroke(220, 230, 245);
    doc.setLineWidth(0.3);
    doc.line(marginLeft, pageHeight - 15, pageWidth - marginRight, pageHeight - 15);

    try {
      if (LOGO_APHP_PLACEHOLDER) {
        doc.addImage(LOGO_APHP_PLACEHOLDER, 'PNG', marginLeft, pageHeight - 11, logoW, logoH);
      }
    } catch (e) { /* logo indisponible, on continue sans */ }

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    ink(92, 107, 133);
    doc.text('Page ' + p + ' / ' + pageCount, pageWidth - marginRight, pageHeight - 9, { align: 'right' });
  }

  return doc.output('blob');
}

function triggerDownload(blob, filename) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

document.getElementById('btn-download-pdf').addEventListener('click', function () {
  var blob = buildPdfBlob(currentMetierNom);
  triggerDownload(blob, 'mes_outils_' + (currentMetierNom || 'metier').replace(/\s+/g, '_') + '.pdf');
});

grist.ready({ requiredAccess: 'full' });
loadData();

</script>
